[project]
name = "anki-cli"
version = "0.1.0"
description = "CLI for Anki note upserts"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "markdown-it-py>=3.0.0",
  "nh3>=0.2.18",
]

[project.scripts]
anki-cli = "anki_cli.cli:main"

[build-system]
requires = ["uv_build>=0.10.0,<0.11.0"]
build-backend = "uv_build"

[tool.pytest.ini_options]
testpaths = ["tests"]
